name: Watch prices

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, off the hour to avoid the top-of-hour rush
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet .

      - name: Fetch prices
        id: fetch
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: hotelwatch run

      - name: Commit readings
        run: |
          git config user.name "hotelwatch[bot]"
          git config user.email "hotelwatch[bot]@users.noreply.github.com"
          git add data/history.jsonl docs/data/history.json
          if git diff --cached --quiet; then
            echo "no new readings"
          else
            git commit -m "chore: price reading $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Open or update alert issue
        if: hashFiles('data/alerts.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(python3 - <<'EOF'
          import json
          alerts = json.load(open("data/alerts.json"))
          lines = [f"- **{a['kind']}** — {a['message']}  \n  [Open booking page]({a['url']})" for a in alerts]
          print("\n".join(lines))
          EOF
          )
          title="Price alert: $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --label price-alert --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create price-alert --color D73A4A --description "Automated price alerts" 2>/dev/null || true
            gh issue create --title "$title" --label price-alert --body "$body"
          fi

      - name: Fail if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::one or more targets failed; see 'Fetch prices' step"
          exit 1
