                <script type="text/javascript">
                    function checkAvailability() {   
                        //invoke remote command                        
                        updateSearchResult();
                        TL.reservation.disable();
                    };
                                    
                    function checkAvailabilityAndCleanupHighlightProduct() {

                        cleanupHighlightProduct();
                        updateSearchResult();
                        TL.reservation.disable();
                    }
                    
                    function updateSearchResultCompleted() {
                        reservationBarUpdate();
                        summarybarUpdate();
                        filterBarUpdate();
                        TL.ui.BlockRateInit();
                        TL.ui.BlockRateArrow();
                        TL.ui.PriceTable.init();
                        PriceBreakdownInit();
                        TimeCounterInit();
                        showAnnouncementWidget();
                        showAnnouncementTopBar();
                        bookingSummaryBarInit();
                        initHorizontalBenefitRow();
                        initVerticalBenefitRow();  
                    }
                               
                    function initVerticalBenefitRow() {

                        var isDisplayDetails = isDisplayRateSelectionDetailsByDefault();
                        if (isDisplayDetails !== 'true') {
                            return;
                        }

                        var showBenefitTraggers = $('.js-benefits-accordion.plus');
                        if (showBenefitTraggers === 'undefined') {
                            return;
                        }

                        if (showBenefitTraggers.length > 0) {
                            showBenefitTraggers.each(function(i, el) {el.click();});
                        }
                    }

                    function initHorizontalBenefitRow() {

                        var isDisplayDetails = isDisplayRateSelectionDetailsByDefault();
                        if (isDisplayDetails !== 'true') {
                            return;
                        }

                        var showBenefitTraggers = $('.title > .js-detail-toggle');
                        if (showBenefitTraggers === 'undefined') {
                            return;
                        }

                        if (showBenefitTraggers.length > 0) {
                            showBenefitTraggers.each(function(i, el) {el.click();});
                        }
                    }

                    function isDisplayRateSelectionDetailsByDefault() {
                        return $('#rate_selection_details_display_by_default').val();
                    }

                    function reservationBarUpdate(){
                        window.localData.h_lang = 'en'
                        
                        //Init calendar by seleted language
                        var language = 'en' === 'zh' ? 'zh_cn' : 'en';
                        moment.locale(language);
                        
                        InitSidePanel();
                        InitReservationBar();
                        InitReservationCalendar();           
                        InitPropertyDailyAvailability();
                    }

                    function summarybarUpdate() {
                        var numberOfRoom = $('#numofroom').val();
                        if(numberOfRoom > 1) {
                            window.onscroll = TL.summary.recalc;
                            $(window).trigger('scroll');
                        }
                    }
                    
                    function filterBarUpdate() {
                        TL.ui.QuickFilterInit();
                    }

                    function activeModifySearchCriteriaPanel() {
                        TL.reservation.enable();
                    }
                </script>
