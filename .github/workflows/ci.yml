name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "docs/data/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --quiet -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: hotelwatch validate

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Type-check and build into a scratch dir: the committed docs/ bundle is built locally.
      - run: npx tsc --noEmit
      - run: npx vite build --outDir ../.ci-build --emptyOutDir
