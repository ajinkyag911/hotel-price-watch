name: Scan date windows

on:
  schedule:
    - cron: "41 2 * * *" # daily, 02:41 UTC (08:11 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet .

      - name: Scan
        id: scan
        continue-on-error: true
        run: hotelwatch scan

      - name: Commit results
        run: |
          git config user.name "hotelwatch[bot]"
          git config user.email "hotelwatch[bot]@users.noreply.github.com"
          git add data/scans.jsonl docs/data/history.json
          if git diff --cached --quiet; then
            echo "no new results"
          else
            git commit -m "chore: date scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

      - name: Fail if scan failed
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::one or more scans produced no data; see 'Scan' step"
          exit 1
