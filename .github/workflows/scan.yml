name: Scan date windows

on:
  schedule:
    - cron: "41 2 * * *" # daily, 02:41 UTC (08:11 IST)
  workflow_dispatch:
    inputs:
      only:
        description: "Scan ids to run, space-separated (default: all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: commit-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet .

      - name: Scan
        id: scan
        continue-on-error: true
        env:
          # Slower pacing from datacenter IPs keeps the edge happy.
          HOTELWATCH_DELAY: "2.5"
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            hotelwatch scan --only ${{ inputs.only }}
          else
            hotelwatch scan
          fi

      - name: Commit results
        run: scripts/commit-data.sh data/scans.jsonl "chore: date scan $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Fail if scan failed
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::one or more scans produced no data; see 'Scan' step"
          exit 1
